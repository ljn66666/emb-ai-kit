<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="980" height="660" fill="#ffffff"/>
  <text x="30" y="46" font-size="24" font-weight="700" fill="#0f172a">ESP32 舵机 + I2S 音频 · 逐脚接线图</text>
  <text x="30" y="72" font-size="13" fill="#64748b">Seeed XIAO ESP32S3 Sense ｜ 4× SG90 ｜ MAX98357A ｜ 红 = 5V ｜ 黑 = GND ｜ 橙 = 信号</text>
  <line x1="30" y1="86" x2="950" y2="86" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ============ 左：电源拓扑 ============ -->
  <text x="30" y="120" font-size="15" font-weight="700" fill="#0f172a">电源拓扑</text>
  <text x="30" y="140" font-size="11.5" fill="#64748b">这一侧决定你会不会「一动就重启」</text>

  <!-- 舵机 -->
  <rect x="300" y="170" width="180" height="80" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="390" y="202" font-size="15" font-weight="600" fill="#9a3412" text-anchor="middle">舵机 ×4</text>
  <text x="390" y="224" font-size="11.5" fill="#c2410c" text-anchor="middle">VCC 红线 / GND 棕线</text>

  <!-- 5V 电源 -->
  <rect x="55" y="380" width="190" height="86" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="150" y="410" font-size="14.5" font-weight="600" fill="#991b1b" text-anchor="middle">5V / ≥3A 独立电源</text>
  <text x="150" y="432" font-size="11.5" fill="#dc2626" text-anchor="middle">只给舵机，不给主控</text>
  <text x="150" y="452" font-size="11.5" fill="#dc2626" text-anchor="middle">四颗 SG90 峰值 2.8A</text>

  <!-- 主控 -->
  <rect x="330" y="380" width="185" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="422" y="410" font-size="14.5" font-weight="600" fill="#1e40af" text-anchor="middle">XIAO 主控</text>
  <text x="422" y="432" font-size="11.5" fill="#2563eb" text-anchor="middle">由 USB 供电</text>
  <text x="422" y="452" font-size="11" fill="#1d4ed8" text-anchor="middle">别从这里取 5V 带动舵机</text>

  <!-- 5V 线 -->
  <path d="M150 380 L150 210 L300 210" fill="none" stroke="#dc2626" stroke-width="3"/>
  <circle cx="150" cy="380" r="4" fill="#dc2626"/>
  <circle cx="300" cy="210" r="4" fill="#dc2626"/>
  <!-- 470uF 电容符号 -->
  <line x1="130" y1="302" x2="170" y2="302" stroke="#dc2626" stroke-width="3.5"/>
  <line x1="130" y1="314" x2="170" y2="314" stroke="#dc2626" stroke-width="3.5"/>
  <text x="180" y="298" font-size="12.5" font-weight="700" fill="#b91c1c">470 µF</text>
  <text x="180" y="316" font-size="11" fill="#ef4444">跨接 5V 与 GND</text>
  <text x="180" y="332" font-size="11" fill="#ef4444">吸收舵机启动浪涌</text>

  <!-- GND 回线 -->
  <path d="M150 466 L150 545 L422 545 L422 466" fill="none" stroke="#111827" stroke-width="3"/>
  <circle cx="150" cy="466" r="4" fill="#111827"/>
  <circle cx="422" cy="466" r="4" fill="#111827"/>
  <text x="286" y="568" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">这根 GND 必须连到主控</text>

  <!-- ============ 右：引脚对应 ============ -->
  <text x="540" y="120" font-size="15" font-weight="700" fill="#0f172a">引脚对应（照抄，不要改）</text>

  <g font-size="13">
    <text x="540" y="150" font-size="11.5" font-weight="700" fill="#64748b">主控引脚</text>
    <text x="700" y="150" font-size="11.5" font-weight="700" fill="#64748b">接到</text>
    <text x="890" y="150" font-size="11.5" font-weight="700" fill="#64748b">线色</text>
    <line x1="540" y1="158" x2="950" y2="158" stroke="#e2e8f0"/>

    <rect x="540" y="168" width="410" height="98" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="552" y="192" font-size="13" font-weight="700" fill="#334155">D1 / D2 / D3 / D4</text>
    <text x="700" y="192" font-size="13" fill="#334155">舵机 1–4 信号</text>
    <text x="890" y="192" font-size="12" fill="#ea580c">橙</text>
    <text x="552" y="216" font-size="11.5" fill="#64748b">D5 / D6 / D7 可继续接 5–7 号</text>
    <text x="552" y="242" font-size="12.5" font-weight="700" fill="#b91c1c">D0 必须空着</text>
    <text x="700" y="242" font-size="11.5" fill="#b91c1c">strapping 脚，上电会甩</text>

    <rect x="540" y="278" width="410" height="88" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="552" y="302" font-size="13" font-weight="700" fill="#334155">GPIO12</text>
    <text x="700" y="302" font-size="13" fill="#334155">MAX98357A · BCLK</text>
    <text x="552" y="324" font-size="13" font-weight="700" fill="#334155">GPIO13</text>
    <text x="700" y="324" font-size="13" fill="#334155">MAX98357A · LRCLK</text>
    <text x="552" y="346" font-size="13" font-weight="700" fill="#334155">GPIO14</text>
    <text x="700" y="346" font-size="13" fill="#334155">MAX98357A · DIN</text>

    <rect x="540" y="378" width="410" height="72" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="552" y="402" font-size="13" font-weight="700" fill="#334155">舵机 VCC</text>
    <text x="700" y="402" font-size="13" fill="#334155">独立 5V 正极</text>
    <text x="890" y="402" font-size="12" fill="#dc2626">红</text>
    <text x="552" y="426" font-size="13" font-weight="700" fill="#334155">舵机 GND</text>
    <text x="700" y="426" font-size="12.5" fill="#334155">独立电源负极 + XIAO GND</text>
    <text x="890" y="426" font-size="12" fill="#111827">棕</text>
  </g>

  <!-- 警示条 -->
  <rect x="540" y="470" width="410" height="76" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="552" y="494" font-size="12.5" font-weight="700" fill="#92400e">没接这根 GND 会怎样</text>
  <text x="552" y="516" font-size="11.5" fill="#b45309">台面上好的，装进外壳就开始抖；串口偶尔乱码；查代码永远查不出来。</text>
  <text x="552" y="536" font-size="11.5" fill="#b45309">一根线解决大约 80% 的「灵异」问题。</text>

  <!-- 底部结论 -->
  <rect x="30" y="592" width="920" height="1" fill="#e2e8f0"/>
  <text x="30" y="616" font-size="12.5" fill="#475569">排第一的故障永远是电源。判据：峰值需求 ÷ 可用电流 &lt; 70% 才稳。</text>
  <text x="30" y="638" font-size="12.5" fill="#475569">四颗 SG90 挂 3A 电源 = 93%，落在「时好时坏」区间，必须配合错峰调度。</text>
</svg>
